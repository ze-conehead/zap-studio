name: CI

# Fast sanity check on every push/PR: does the web app still typecheck,
# build and lint clean? Separate from build-desktop.yml, which is the slow,
# one-installer-per-OS job that only runs on a tag or by hand.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
