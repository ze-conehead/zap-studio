name: Build desktop app

# Cross-compiling Windows/Linux installers from macOS is unreliable — one
# native runner per OS is the realistic way to get all three. Manual trigger
# plus version tags, so a normal push doesn't spend CI minutes packaging
# installers (that's what ci.yml is for).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  # Only for a "vX.Y.Z" tag push: gathers what all three OS jobs built and
  # attaches them to one GitHub Release. workflow_dispatch runs stop after
  # `build` — nothing to publish a release under without a tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
